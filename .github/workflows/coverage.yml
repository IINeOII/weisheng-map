# 資料覆蓋率：由 GitHub 的伺服器查詢 OpenStreetMap 上各類別的真實資料量
# 不需要在自己電腦上安裝任何東西。
# 手動執行：Actions → 資料覆蓋率 → Run workflow（可以改要查的區域）
# 每週一自動執行一次，追蹤補資料的進度。結果在每次執行的「Summary」頁，也可以下載 JSON。
name: 資料覆蓋率
on:
  workflow_dispatch:
    inputs:
      areas:
        description: "要查的區域，用空白分隔（台北 新北 桃園 台中 台南 高雄 萬華 台北車站，或 南,西,北,東）"
        default: "台北車站 萬華 台北 新北 台中 高雄"
        required: true
  schedule:
    - cron: "17 1 * * 1" # 每週一台灣時間 09:17

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 查詢各區域
        env:
          AREAS: ${{ github.event.inputs.areas || '台北車站 萬華 台北 新北 台中 高雄' }}
        run: |
          echo "## OpenStreetMap 資料覆蓋率（$(date -u +%F)）" >> "$GITHUB_STEP_SUMMARY"
          for a in $AREAS; do
            node scripts/coverage.mjs "$a" || echo "⚠️ $a 查詢失敗" >> "$GITHUB_STEP_SUMMARY"
            sleep 10 # 對 Overpass 公共伺服器客氣一點
          done
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: reports/
          retention-days: 90
