# 網頁版發佈：測試 → 建置地點資料 → 發佈
# - main 有更新時執行
# - 每週一自動執行一次，下載最新的 OpenStreetMap 台灣資料
# - 也可以手動執行：Actions → 發佈網頁版 → Run workflow
# 每次執行的 Summary 頁會列出各區域的資料覆蓋率。
# 注意：GitHub 免費帳號只有公開倉庫能用 Pages（CONSTRAINTS.md C11）
name: 發佈網頁版
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * 1" # 每週一台灣時間 09:17
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install osmium
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # 建置地點資料（OSM＋政府開放資料）：和 PR 檢查共用同一份流程，PR 上就能先看到真實資料的匯入結果
  data:
    uses: ./.github/workflows/build-data.yml

  deploy:
    needs: [test, data]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: osm-data
          path: docs/data/osm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
