# 暫時用：在真實網路上查看政府資料集內容（合併前刪除）
name: 查看政府資料集
on:
  push:
    branches: [gov-open-data]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: PROBE_ALL=1 node scripts/probe-gov.mjs 121332 135279 121330 83868 91950 171101 125392 147413 > probe.txt
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: probe.txt }
      - run: cat probe.txt
