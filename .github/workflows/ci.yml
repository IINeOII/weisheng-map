# 開 PR 或推送到其他分支時自動跑：靜態檢查 + 網頁與 App 模式的測試
# 測試沒過，就不要合併、不要上架（main 分支的測試由 pages.yml 在發佈前執行）
name: 檢查與測試
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 測試失敗的截圖
          path: test-results/
          retention-days: 7
