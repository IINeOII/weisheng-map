# 暫時用：比較三種底圖的速度和清晰度（合併前刪除）
name: 量測載入速度
on:
  push:
    branches: [measure-load]
    paths-ignore: [lab-shots/**]
permissions:
  contents: write
jobs:
  basemaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # GitHub Pages 會壓縮檔案；本機伺服器用預先壓縮的檔案模擬，下載量才接近真實
      - run: |
          find docs -name "*.js" -o -name "*.css" -o -name "*.json" | xargs gzip -k -9
          npx http-server docs -p 4173 -g -s &
          sleep 3
      - run: |
          mkdir -p lab-shots
          for m in osm ofm nlsc; do
            node scripts/measure-load.mjs "http://localhost:4173/lab/basemap.html?map=$m&z=17" --runs 3 --shot lab-shots/$m-z17.png
            node scripts/measure-load.mjs "http://localhost:4173/lab/basemap.html?map=$m&z=15" --runs 1 --shot lab-shots/$m-z15.png
          done
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add lab-shots && git commit -m "量測截圖" && git push
